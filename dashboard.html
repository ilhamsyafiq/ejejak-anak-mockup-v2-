<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — e-Jejak Anak</title>
  <meta name="description" content="Dashboard ibu bapa: ringkasan akaun, anak, sejarah & profil.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260806j">

</head>
<body data-page="dashboard" data-auth="parent">
  <div id="site-header"></div>

  <header class="page-head">
    <div class="container">
      <nav class="breadcrumb"><span>Dashboard</span></nav>
      <div class="dash-welcome">
        <span class="dash-welcome__avatar" data-user-initial aria-hidden="true">A</span>
        <div>
          <h1 class="dash-welcome__title"><span data-greeting>Selamat datang</span>, <span data-user-name>Ibu Bapa</span></h1>
          <p class="dash-welcome__sub"><span data-welcome-date></span></p>
        </div>
      </div>
    </div>
  </header>

  <main class="section">
    <!-- #dash-hub = penanda halaman dashboard untuk main.js (initDashboard) -->
    <div class="container" id="dash-hub">

      <!-- Ringkasan -->
      <div class="grid grid-3" style="margin-bottom:var(--sp-5)">
        <div class="card" data-screening-only><div class="mini-stat"><b class="tnum" id="st-children">0</b><span>Profil anak</span></div></div>
        <div class="card" data-screening-only><div class="mini-stat"><b class="tnum" id="st-screenings">0</b><span>Saringan selesai</span></div></div>
        <div class="card" data-screening-only><div class="mini-stat"><b class="tnum" id="st-avg">0%</b><span>Purata kemahiran dicapai</span></div></div>
      </div>

      <!-- Banner akaun e-Pembelajaran (dipapar oleh main.js untuk akaun 'knowledge') -->
      <div class="notice" id="dash-knowledge" style="display:none; margin-bottom:var(--sp-5); align-items:center; gap:var(--sp-3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Akaun anda ialah akaun <strong>e-Pembelajaran</strong> — tiada saringan anak diperlukan. Terokai bahan pembelajaran di <a href="pendidikan.html">Pusat e-Pembelajaran</a>.</span>
      </div>

      <!-- Sejarah saringan terkini (ringkas) -->
      <div data-screening-only>
        <div class="flex items-center justify-between wrap gap-3" style="margin-bottom:var(--sp-3)">
          <h2 style="margin:0">Saringan Terkini</h2>
          <a class="btn btn--ghost" href="sejarah.html">Lihat Semua Sejarah</a>
        </div>
        <div class="card" style="padding:0; overflow:hidden">
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Anak</th><th>Tarikh</th><th>Umur</th><th>Markah</th><th>Triage</th><th></th></tr></thead>
              <tbody id="dash-history"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js?v=20260806y"></script>
</body>
</html>
