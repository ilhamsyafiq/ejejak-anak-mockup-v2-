<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maklumat Keluarga — e-Jejak Anak</title>
  <meta name="description" content="Maklumat keluarga ibu bapa: daerah serta butiran ibu & bapa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260806e">
</head>
<body data-page="profil" data-auth="parent">
  <div id="site-header"></div>

  <header class="page-head">
    <div class="container">
      <nav class="breadcrumb"><a href="dashboard.html">Dashboard</a> / <span>Maklumat Keluarga</span></nav>
      <h1>Maklumat Keluarga</h1>
      <p>Lengkapkan daerah serta butiran ibu &amp; bapa. Maklumat ini membantu doktor menghubungi anda dan digunakan dalam laporan.</p>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width:720px">
      <div class="card">
        <form id="family-form">
          <div class="notice notice--ok" id="fam-msg" style="display:none; margin-bottom:var(--sp-3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span></span></div>

          <div class="field">
            <label for="fam-district">Daerah (Kelantan)</label>
            <select class="select" id="fam-district">
              <option value="">— Pilih daerah —</option>
              <option value="Kota Bharu">Kota Bharu</option>
              <option value="Pasir Mas">Pasir Mas</option>
              <option value="Tumpat">Tumpat</option>
              <option value="Pasir Puteh">Pasir Puteh</option>
              <option value="Bachok">Bachok</option>
              <option value="Machang">Machang</option>
              <option value="Tanah Merah">Tanah Merah</option>
              <option value="Kuala Krai">Kuala Krai</option>
              <option value="Gua Musang">Gua Musang</option>
              <option value="Jeli">Jeli</option>
            </select>
          </div>

          <!-- Maklumat Bapa -->
          <div class="notice" style="margin:var(--sp-3) 0 var(--sp-2)"><strong>Maklumat Bapa</strong></div>
          <div class="field"><label for="fam-father-name">Nama Bapa</label><input class="input" type="text" id="fam-father-name" placeholder="Nama penuh bapa"></div>
          <div class="field-row">
            <div class="field"><label for="fam-father-ic">No. Kad Pengenalan</label><input class="input" type="text" id="fam-father-ic" placeholder="cth. 800101-03-5555"></div>
            <div class="field"><label for="fam-father-phone">No. Telefon</label><input class="input" type="tel" id="fam-father-phone" placeholder="cth. 0123456789"></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="fam-father-job">Pekerjaan</label><input class="input" type="text" id="fam-father-job" placeholder="cth. Peniaga"></div>
            <div class="field"><label for="fam-father-income">Pendapatan Bulanan (RM)</label><input class="input" type="number" min="0" id="fam-father-income" placeholder="cth. 3000"></div>
          </div>

          <!-- Maklumat Ibu -->
          <div class="notice" style="margin:var(--sp-3) 0 var(--sp-2)"><strong>Maklumat Ibu</strong></div>
          <div class="field"><label for="fam-mother-name">Nama Ibu</label><input class="input" type="text" id="fam-mother-name" placeholder="Nama penuh ibu"></div>
          <div class="field-row">
            <div class="field"><label for="fam-mother-ic">No. Kad Pengenalan</label><input class="input" type="text" id="fam-mother-ic" placeholder="cth. 820202-03-6666"></div>
            <div class="field"><label for="fam-mother-phone">No. Telefon</label><input class="input" type="tel" id="fam-mother-phone" placeholder="cth. 0198765432"></div>
          </div>
          <div class="field-row">
            <div class="field"><label for="fam-mother-job">Pekerjaan</label><input class="input" type="text" id="fam-mother-job" placeholder="cth. Suri rumah"></div>
            <div class="field"><label for="fam-mother-income">Pendapatan Bulanan (RM)</label><input class="input" type="number" min="0" id="fam-mother-income" placeholder="cth. 0"></div>
          </div>

          <button class="btn btn--block" type="submit"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Simpan Maklumat Keluarga</button>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js?v=20260806r"></script>
</body>
</html>
